[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperspace"
version = "0.1.0"
description = "Hyperspace distributed compute mesh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42.0",
]

[project.scripts]
hyperspace = "apps.cli.main:main"
hyperspace-agent = "apps.agent.main:main"
hyperspace-controller = "apps.control_plane.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
hyperspace = "packages/hyperspace"
apps = "apps"

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["hyperspace*", "apps*"]